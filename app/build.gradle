plugins { id 'com.android.application' }

android {
    namespace 'id.zani.rec'
    compileSdk 34

    defaultConfig {
        applicationId 'id.zani.rec'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // ditandatangani dengan debug key supaya APK release langsung bisa di-install
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
// Sengaja TANPA dependency apa pun: hanya framework Android supaya APK kecil dan cepat.
