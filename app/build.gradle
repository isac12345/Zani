plugins { id 'com.android.application' }

android {
    namespace 'id.zani.rec'
    compileSdk 34

    defaultConfig {
        applicationId 'id.zani.rec'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // CI: kunci rilis dari brankas (secrets); lokal: debug key
            signingConfig System.getenv("KEYSTORE_PASSWORD") != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Hanya untuk ujian (tidak masuk APK): JUnit4
    testImplementation 'junit:junit:4.13.2'
}
// Sengaja TANPA dependency apa pun selain ujian: hanya framework Android supaya APK kecil dan cepat.
